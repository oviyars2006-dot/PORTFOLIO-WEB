<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Collections | Oviya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #fff; overflow-x: hidden; }
        
        /* RESPONSIVE OUTLINE TEXT: Scale down automatically for mobile */
        .outline-text { 
            font-size: clamp(3.5rem, 12vw, 8rem);
            -webkit-text-stroke: 1px rgba(255,255,255,0.3); 
            color: transparent; 
            line-height: 1;
        }
        
        /* Modal Overlay Responsive Padding */
        #gallery-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 100;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        /* Responsive Grid for Gallery content */
        @media (min-width: 768px) {
            #gallery-overlay { padding: 4rem 2rem; }
        }

        /* Hide scrollbar for cleaner look in overlay */
        #gallery-overlay::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <nav class="p-4 md:p-8 flex justify-between items-center fixed top-0 w-full z-50 bg-black/90 backdrop-blur-md border-b border-white/5">
        <a href="index.html" class="font-black text-lg md:text-xl uppercase tracking-tighter">OVIYA.</a>
        <a href="index.html" class="text-[10px] md:text-xs font-bold uppercase tracking-widest px-4 md:px-6 py-2 border border-white/20 rounded-full hover:bg-white hover:text-black transition-all">Exit Gallery</a>
    </nav>

    <main class="pt-28 md:pt-40 pb-20 px-4 md:px-6 max-w-7xl mx-auto">
        <h1 class="outline-text font-black uppercase mb-10 md:mb-16 text-center md:text-left">Collections</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
            
            <div onclick="openGallery('branding')" class="group cursor-pointer">
                <div class="aspect-[3/4] overflow-hidden rounded-2xl bg-zinc-900 border border-white/5 relative">
                    <img src="CASE 5.png" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt="Branding">
                    <div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="text-[10px] md:text-xs font-bold uppercase tracking-widest bg-white/10 backdrop-blur-sm px-4 py-2 rounded-full">View Collection</span>
                    </div>
                </div>
                <h3 class="mt-4 md:mt-6 font-black uppercase text-lg md:text-xl">Branding Designs</h3>
                <p class="text-gray-500 text-[10px] md:text-xs uppercase tracking-widest">Identity & Logo Design</p>
            </div>

            <div onclick="openGallery('social')" class="group cursor-pointer">
                <div class="aspect-[3/4] overflow-hidden rounded-2xl bg-zinc-900 border border-white/5 relative">
                    <img src="WEEKEND.jpeg" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt="Social Media">
                    <div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="text-[10px] md:text-xs font-bold uppercase tracking-widest bg-white/10 backdrop-blur-sm px-4 py-2 rounded-full">View Collection</span>
                    </div>
                </div>
                <h3 class="mt-4 md:mt-6 font-black uppercase text-lg md:text-xl">Marketing Kits</h3>
                <p class="text-gray-500 text-[10px] md:text-xs uppercase tracking-widest">Social Media Assets</p>
            </div>

            <div onclick="openGallery('posters')" class="group cursor-pointer">
                <div class="aspect-[3/4] overflow-hidden rounded-2xl bg-zinc-900 border border-white/5 relative">
                    <img src="MAGGIE3-1.png" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt="Posters">
                    <div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="text-[10px] md:text-xs font-bold uppercase tracking-widest bg-white/10 backdrop-blur-sm px-4 py-2 rounded-full">View Collection</span>
                    </div>
                </div>
                <h3 class="mt-4 md:mt-6 font-black uppercase text-lg md:text-xl">Film Posters</h3>
                <p class="text-gray-500 text-[10px] md:text-xs uppercase tracking-widest">Digital Illustrations</p>
            </div>

        </div>
    </main>

    <div id="gallery-overlay">
        <div class="max-w-5xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 md:mb-12">
                <h2 id="gallery-title" class="text-xl md:text-3xl font-black uppercase tracking-widest">Collection Name</h2>
                <button onclick="closeGallery()" class="w-full md:w-auto text-[10px] font-bold uppercase tracking-widest px-6 py-3 border border-white/30 hover:bg-white hover:text-black transition-all">Close Gallery [ESC]</button>
            </div>
            
            <div id="gallery-content" class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 pb-10">
                </div>
        </div>
    </div>

    <script>
        const collections = {
            branding: {
                title: "Sakura Branding Identity",
                images: ["CASE 5.png", "CASE 4.png", "CASE 1.png", "CASE 2.png", "CASE 3.png"]
            },
            social: {
                title: "Social Media Marketing Kits",
                images: ["WEEKEND.jpeg", "LOGO.jpeg", "badge.jpeg", "JUICE .jpeg"]
            },
            posters: {
                title: "Cinematic Posters",
                images: ["MAGGIE3-1.png", "BANGARAM CAFE 1.png", "MAGGIEEEE-1.png"]
            }
        };

        function openGallery(id) {
            const data = collections[id];
            const overlay = document.getElementById('gallery-overlay');
            const content = document.getElementById('gallery-content');
            const title = document.getElementById('gallery-title');

            title.innerText = data.title;
            content.innerHTML = data.images.map(img => `
                <div class="rounded-xl overflow-hidden bg-zinc-900 border border-white/5">
                    <img src="${img}" class="w-full h-auto block" loading="lazy">
                </div>
            `).join('');

            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }

        function closeGallery() {
            document.getElementById('gallery-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('keydown', (e) => { if(e.key === "Escape") closeGallery(); });
    </script>

</body>
</html>
